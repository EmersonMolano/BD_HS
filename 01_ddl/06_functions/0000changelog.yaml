  # 1. Security Helpers (user_account + home)
  - changeSet:
      id: a1b2c3d4-fn-001-security
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,function,security"
      comment: Creates security helper functions for RLS and access control.
      changes:
        - sqlFile:
            path: 001_fn_security_helpers.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sql: |
            DROP FUNCTION IF EXISTS user_account.fn_app_current_user_id();
            DROP FUNCTION IF EXISTS home.fn_is_home_member(UUID, UUID);
            DROP FUNCTION IF EXISTS home.fn_is_home_owner(UUID, UUID);
            DROP FUNCTION IF EXISTS device.fn_can_access_device(UUID, UUID);

  # 2. Consumption Calculations (consumption)
