            DROP FUNCTION IF EXISTS alert_rate.fn_check_threshold(DECIMAL, UUID, DATE);
            DROP FUNCTION IF EXISTS alert_rate.fn_is_leak_detected(UUID, TIMESTAMPTZ, INTEGER);

  # 4. Vacation Helpers (home)
