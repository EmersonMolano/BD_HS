      id: a1b2c3d4-fn-002-consumption
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,function,consumption"
      comment: Creates consumption calculation functions.
      changes:
        - sqlFile:
            path: 002_fn_consumption_calculations.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sql: |
            DROP FUNCTION IF EXISTS consumption.fn_calculate_consumption(UUID, DATE, DATE);
            DROP FUNCTION IF EXISTS consumption.fn_calculate_cost(DECIMAL, UUID, DATE);
            DROP FUNCTION IF EXISTS consumption.fn_get_daily_consumption(UUID, DATE);
            DROP FUNCTION IF EXISTS consumption.fn_get_monthly_consumption(UUID, INTEGER, INTEGER);

  # 3. Alert Validation (alert_rate)
